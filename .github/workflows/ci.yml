name: Production Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify build toolchain
        run: npm ls vite typescript @tailwindcss/vite --depth=0

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require

      - name: Validate production environment contract
        run: npm run env:check
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          APP_URL: https://ci.example.test
          FRONTEND_URL: https://ci.example.test
          LOCAL_BRIDGE_ENABLED: "false"
          SCRAPER_BYPASS_MODE: never

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build
