name: Production Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify build toolchain
        run: npm ls vite typescript @tailwindcss/vite --depth=0

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require

      - name: Validate production environment contract
        run: npm run env:check
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          APP_URL: https://ci.example.test
          FRONTEND_URL: https://ci.example.test
          LOCAL_BRIDGE_ENABLED: "false"
          SCRAPER_BYPASS_MODE: never

      - name: Enforce production safety contract
        run: npm run safety:production

      - name: Enforce existing-product audit safety contract
        run: npx tsx scripts/existing-product-audit-safety-contract.ts

      - name: Enforce Railway safe-mode deployment contract
        run: npx tsx scripts/railway-safe-mode-safety-contract.ts

      - name: Enforce runtime autostart safety contract
        run: npx tsx scripts/runtime-autostart-safety-contract.ts

      - name: Enforce pre-canary queue safety contract
        run: npx tsx scripts/pre-canary-queue-safety-contract.ts

      - name: Enforce mutation-time canary queue safety contract
        run: npx tsx scripts/catalog-canary-queue-mutation-safety-contract.ts

      - name: Enforce production smoke target safety contract
        run: npx tsx scripts/production-smoke-target-safety-contract.ts

      - name: Enforce production dry-run read-back safety contract
        run: npx tsx scripts/production-smoke-dry-run-readback-safety-contract.ts

      - name: Enforce production one-product canary safety contract
        run: npx tsx scripts/production-canary-safety-contract.ts

      - name: Enforce database preflight schema drift contract
        run: npx tsx scripts/database-preflight-safety-contract.ts

      - name: Enforce production readiness platform contract
        run: npx tsx scripts/readiness-platform-safety-contract.ts

      - name: Enforce Shopify canary read-back safety contract
        run: npx tsx scripts/shopify-canary-readback-safety-contract.ts

      - name: Enforce canary sheet isolation contract
        run: npx tsx scripts/canary-sheet-isolation-safety-contract.ts

      - name: Enforce production catalog source contract
        run: npx tsx scripts/catalog-audit-production-source-safety-contract.ts

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build
