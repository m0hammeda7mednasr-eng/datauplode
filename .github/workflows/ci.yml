name: Production Build Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "dotnet/**"
      - ".github/workflows/dotnet-rebuild-ci.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "dotnet/**"
      - ".github/workflows/dotnet-rebuild-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build
