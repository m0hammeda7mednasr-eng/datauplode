name: Repair Dabdoob Next V47744 color

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RAILWAY_BASE_URL: ${{ secrets.RAILWAY_SMOKE_BASE_URL || 'https://datauplode-production.up.railway.app' }}

jobs:
  repair-v47744:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for this exact commit to be live on Railway
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl --silent --show-error --max-time 20 --output ready.json --write-out '%{http_code}' "${RAILWAY_BASE_URL%/}/api/ready" || true)"
            state="$(TARGET_SHA="$TARGET_SHA" node - <<'NODE'
          const fs = require('node:fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('ready.json', 'utf8')); } catch {}
          const expected = String(process.env.TARGET_SHA || '').toLowerCase();
          const actual = String(body?.deployment?.revision || '').toLowerCase();
          process.stdout.write(body?.deployment?.revisionVerified === true && actual === expected ? 'ready' : `waiting:${actual || 'unknown'}`);
          NODE
            )"
            echo "Railway ${attempt}: HTTP ${code} ${state}"
            if [ "$state" = ready ]; then exit 0; fi
            sleep 10
          done
          exit 2

      - name: Verify exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-unverified-purge" \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          code="$(curl --silent --show-error --max-time 120 --output dryrun.json --write-out '%{http_code}' \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header "x-github-actions-oidc-token: ${oidc_token}" \
            --header 'x-next-color-repair-confirm: REPAIR_NEXT_V47744_COLOR' \
            --data '{"dryRun":true,"confirm":"REPAIR_NEXT_V47744_COLOR"}' \
            "${RAILWAY_BASE_URL%/}/api/admin/repair-next-v47744-color")"
          cat dryrun.json
          HTTP_CODE="$code" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('dryrun.json', 'utf8'));
          const status = Number(process.env.HTTP_CODE);
          if (status < 200 || status >= 300 || body?.success !== true) throw new Error(`repair dry-run failed HTTP=${status} code=${body?.code || 'unknown'}`);
          if (body?.summary?.productId !== 'gid://shopify/Product/8220083322933') throw new Error('wrong Shopify product');
          if (body?.summary?.sourceUrl !== 'https://www.next.ae/en/style/sv004113/v47744') throw new Error('wrong source URL');
          if (Number(body?.summary?.variants) !== 10) throw new Error('unexpected variant count');
          NODE

      - name: Repair color and verify Shopify readback
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-unverified-purge" \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          code="$(curl --silent --show-error --max-time 180 --output repair.json --write-out '%{http_code}' \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header "x-github-actions-oidc-token: ${oidc_token}" \
            --header 'x-next-color-repair-confirm: REPAIR_NEXT_V47744_COLOR' \
            --data '{"confirm":"REPAIR_NEXT_V47744_COLOR"}' \
            "${RAILWAY_BASE_URL%/}/api/admin/repair-next-v47744-color")"
          cat repair.json
          HTTP_CODE="$code" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('repair.json', 'utf8'));
          const status = Number(process.env.HTTP_CODE);
          if (status < 200 || status >= 300 || body?.success !== true) throw new Error(`repair failed HTTP=${status} code=${body?.code || 'unknown'}`);
          if (body?.alreadyRepaired !== true) {
            if (body?.repaired !== true || Number(body?.variants) !== 10) throw new Error('repair was not read-back verified');
            if (JSON.stringify(body?.afterColors) !== JSON.stringify(['Light Green'])) throw new Error(`wrong final color: ${JSON.stringify(body?.afterColors)}`);
          }
          console.log('FINAL_OK V47744 color=Light Green variants=10');
          NODE
