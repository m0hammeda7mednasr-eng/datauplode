name: Railway Readiness Probe

on:
  push:
    branches:
      - probe/railway-readiness-20260904
    paths:
      - .github/workflows/railway-readiness-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Railway readiness and catalog stats read-only
        shell: bash
        run: |
          set -euo pipefail
          base="https://datauplode-production.up.railway.app"
          code="$(curl --silent --show-error --max-time 25 --output ready.json --write-out '%{http_code}' "$base/api/ready" || true)"
          echo "READY_HTTP_STATUS=$code"
          node <<'NODE'
          const fs = require('node:fs');
          let b = {};
          try { b = JSON.parse(fs.readFileSync('ready.json', 'utf8')); }
          catch { console.log('READY_JSON_PARSE=false'); process.exit(0); }
          const out = {
            databaseOk: b?.database?.ok === true,
            databaseTarget: b?.database?.target || null,
            projectRefPinned: b?.database?.projectRefPinned === true,
            projectRefMatched: b?.database?.projectRefMatched === true,
            revision: b?.deployment?.revision || null,
            revisionVerified: b?.deployment?.revisionVerified === true,
            branch: b?.deployment?.branch || null,
            productionEnvironment: b?.platform?.productionEnvironment === true,
            writeSafetyReady: b?.platform?.writeSafetyReady === true,
            safeMode: b?.configuration?.safeMode === true,
            runtimeWriteGateEnabled: b?.configuration?.runtimeWriteGateEnabled === true,
            shopifyConfigured: b?.configuration?.shopifyConfigured ?? null,
          };
          console.log('READINESS=' + JSON.stringify(out));
          NODE

          stats_code="$(curl --silent --show-error --max-time 25 --output stats.json --write-out '%{http_code}' "$base/api/products/stats" || true)"
          echo "STATS_HTTP_STATUS=$stats_code"
          if [[ "$stats_code" == "200" ]]; then
            node <<'NODE'
          const fs=require('node:fs');
          let b={};try{b=JSON.parse(fs.readFileSync('stats.json','utf8'))}catch{}
          const s=b?.stats||b||{};
          console.log('PRODUCT_STATS=' + JSON.stringify({totalLinked:s.totalLinked??null,activeSync:s.activeSync??null,pendingReview:s.pendingReview??null}));
          NODE
          else
            echo "PRODUCT_STATS_BODY=$(head -c 500 stats.json | tr '\n' ' ')"
          fi

          route_code="$(curl --silent --show-error --max-time 25 --output route.txt --write-out '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$base/api/shopify-catalog/reconcile" || true)"
          echo "CATALOG_ROUTE_HTTP_STATUS=$route_code"
          echo "CATALOG_ROUTE_BODY=$(head -c 500 route.txt | tr '\n' ' ')"
