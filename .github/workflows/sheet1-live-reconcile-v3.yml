name: Live Sheet 1 Reconcile V3

on:
  workflow_dispatch:
    inputs:
      production_revision:
        description: Exact 40-character stabilize-supabase-railway commit SHA already deployed to Railway
        required: true
        type: string
      run_confirmation:
        description: Type RUN_SHEET1_RECONCILE_V3 to acknowledge live reconcile intent
        required: true
        type: string
      run_full_reconcile:
        description: After independent CI + dry run + canary + read-back, allow the broad existing-product Sheet 1 reconcile
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: dabdoob-live-sheet1-reconcile-v3
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_URL: ${{ secrets.RAILWAY_SMOKE_BASE_URL }}
      WRITE_TOKEN: ${{ secrets.CATALOG_AUDIT_WRITE_TOKEN }}
      EXPECTED_REVISION: ${{ inputs.production_revision }}
      RUN_CONFIRMATION: ${{ inputs.run_confirmation }}
      ALLOW_FULL_RECONCILE: ${{ inputs.run_full_reconcile }}
      SHEET_CSV: https://docs.google.com/spreadsheets/d/1fCbPajWL3nukX0TdoN1m2X8LV3pfPsxSMLBb0yWug2w/export?format=csv&gid=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate explicit live intent and required secrets
        shell: bash
        run: |
          set -euo pipefail
          revision="$(printf '%s' "$EXPECTED_REVISION" | tr '[:upper:]' '[:lower:]')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "production_revision must be an exact 40-character commit SHA" >&2; exit 1; }
          test "$RUN_CONFIRMATION" = "RUN_SHEET1_RECONCILE_V3" || { echo "Explicit live confirmation is missing" >&2; exit 1; }
          test -n "$BASE_URL" || { echo "RAILWAY_SMOKE_BASE_URL secret is not configured" >&2; exit 1; }
          test -n "$WRITE_TOKEN" || { echo "CATALOG_AUDIT_WRITE_TOKEN secret is not configured" >&2; exit 1; }

      - name: Require successful Production Build Check for exact revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(printf '%s' "$EXPECTED_REVISION" | tr '[:upper:]' '[:lower:]')"
          runs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${revision}&status=completed&per_page=100")"
          count="$(printf '%s' "$runs" | jq --arg revision "$revision" '[.workflow_runs[] | select(.name == "Production Build Check" and (.head_sha | ascii_downcase) == $revision and .conclusion == "success")] | length')"
          test "$count" -ge 1 || { echo "No successful Production Build Check exists for exact revision ${revision}" >&2; exit 1; }

      - name: Require explicit broad-write opt-in
        if: ${{ inputs.run_full_reconcile != true }}
        run: |
          echo "Broad Sheet 1 reconcile is blocked by default."
          echo "Run the independent dry-run/canary/read-back path first, then dispatch again with run_full_reconcile=true."

      - name: Checkout exact production revision
        if: ${{ inputs.run_full_reconcile == true }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_revision }}
          fetch-depth: 1

      - name: Setup Node.js
        if: ${{ inputs.run_full_reconcile == true }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact code revision
        if: ${{ inputs.run_full_reconcile == true }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_REVISION" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"

      - name: Install, typecheck and build
        if: ${{ inputs.run_full_reconcile == true }}
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run lint
          npm run build

      - name: Run live reconcile orchestrator
        if: ${{ inputs.run_full_reconcile == true }}
        run: node scripts/run-sheet1-live-reconcile.mjs
