name: Probe Live Sheet1 Status

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-live-sheet1-status.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe Railway status
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://datauplode-production.up.railway.app'
          mkdir -p .import-status
          curl --silent --show-error --max-time 30 "$BASE/api/ready" -o ready.json || true
          curl --silent --show-error --max-time 30 "$BASE/api/sync-jobs" -o jobs.json || true
          curl --silent --show-error --max-time 30 "$BASE/api/sheet1-reconcile/runs?take=10" -o runs.json || true
          python3 <<'PY'
import json, datetime

def load(path):
    try:
        return json.load(open(path,encoding='utf-8'))
    except Exception as e:
        return {'readError':str(e)}
ready=load('ready.json')
jobs=load('jobs.json')
runs=load('runs.json')
marker='ONE_TIME_SHEET1_RECONCILE:2026-08-09-sheet1-reconcile-v1'
latest=None
if isinstance(jobs,list):
    matches=[j for j in jobs if str(j.get('type',''))==marker]
    if matches:
        latest=matches[0]
        try:
            latest=dict(latest)
            latest['parsedResult']=json.loads(latest.get('result') or '{}')
        except Exception:
            pass
out={
  'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
  'ready':ready,
  'latestMarker':latest,
  'reconcileRuns':runs,
}
with open('.import-status/live-sheet1-status.json','w',encoding='utf-8') as f:
    json.dump(out,f,ensure_ascii=False,indent=2)
    f.write('\n')
print(json.dumps(out,ensure_ascii=False,indent=2))
PY
      - name: Persist snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .import-status/live-sheet1-status.json
          git commit -m 'status: live Sheet1 reconcile snapshot [skip ci]' || true
          git push origin HEAD:main
