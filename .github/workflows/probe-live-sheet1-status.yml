name: Probe Live Sheet1 Status

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-live-sheet1-status.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Railway status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE='https://datauplode-production.up.railway.app'
          curl --silent --show-error --max-time 30 "$BASE/api/health" -o health.json || true
          curl --silent --show-error --max-time 30 "$BASE/api/ready" -o ready.json || true
          curl --silent --show-error --max-time 30 "$BASE/api/sync-jobs" -o jobs.json || true
          python3 <<'PY'
          import json, datetime
          def load(path):
              try:
                  return json.load(open(path, encoding='utf-8'))
              except Exception as e:
                  try:
                      return {'raw': open(path, encoding='utf-8', errors='replace').read()[:2000], 'readError': str(e)}
                  except Exception as e2:
                      return {'readError': str(e2)}
          def parsed(job):
              if not isinstance(job, dict): return job
              out = dict(job)
              try: out['parsedResult'] = json.loads(job.get('result') or '{}')
              except Exception: pass
              return out
          health = load('health.json')
          ready = load('ready.json')
          jobs = load('jobs.json')
          marker = 'ONE_TIME_SHEET1_RECONCILE:2026-08-09-sheet1-reconcile-v1'
          matches = []
          if isinstance(jobs, list):
              matches = [parsed(j) for j in jobs if str(j.get('type','')) == marker]
          latest = matches[0] if matches else None
          out = {
              'capturedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'health': health,
              'ready': ready,
              'latestFirstFiveJob': latest,
              'matchingJobCount': len(matches),
          }
          with open('status.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          {
            echo 'LIVE FIRST-FIVE PROBE'
            echo
            echo '```json'
            cat status.json
            echo '```'
          } > issue-body.md
          gh issue edit 5 --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          # probe refresh 2026-08-09
