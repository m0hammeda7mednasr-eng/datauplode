name: Purge Dabdoob orphan drafts

on:
  push:
    branches: [main]
    paths:
      - src/server/routes/shopify-orphan-purge.routes.ts
      - src/server/routes/sync-job-quarantine.routes.ts
      - .github/workflows/purge-dabdoob-orphan-drafts.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RAILWAY_BASE_URL: ${{ secrets.RAILWAY_SMOKE_BASE_URL || 'https://datauplode-production.up.railway.app' }}
  CONFIRM: PURGE_DABDOOB_ORPHAN_DRAFTS

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Request repository-bound OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_BASE_URL"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-orphan-purge" \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
          test -n "$token"
          echo "::add-mask::$token"

      - name: Wait for this exact commit to be live on Railway
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code="$(curl --silent --show-error --max-time 20 --output ready.json --write-out '%{http_code}' "${RAILWAY_BASE_URL%/}/api/ready" || true)"
            state="$(TARGET_SHA="$TARGET_SHA" node - <<'NODE'
          const fs = require('node:fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('ready.json', 'utf8')); } catch {}
          const expected = String(process.env.TARGET_SHA || '').toLowerCase();
          const actual = String(body?.deployment?.revision || '').toLowerCase();
          process.stdout.write(body?.deployment?.revisionVerified === true && actual === expected ? 'ready' : `waiting:${actual || 'unknown'}`);
          NODE
            )"
            echo "Railway ${attempt}: HTTP ${code} ${state}"
            if [ "$state" = ready ]; then exit 0; fi
            sleep 10
          done
          echo 'Exact Railway revision never became ready; no delete attempted.' >&2
          exit 2

      - name: Dry-run exact orphan scope
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-orphan-purge" \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          code="$(curl --silent --show-error --max-time 60 --output dryrun.json --write-out '%{http_code}' \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header "x-github-actions-oidc-token: ${oidc_token}" \
            --header "x-shopify-orphan-purge-confirm: ${CONFIRM}" \
            --data '{"dryRun":true,"limit":25,"confirm":"PURGE_DABDOOB_ORPHAN_DRAFTS"}' \
            "${RAILWAY_BASE_URL%/}/api/admin/purge-shopify-orphans")"
          cat dryrun.json
          HTTP_CODE="$code" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('dryrun.json', 'utf8'));
          const state = body?.state || {};
          if (Number(process.env.HTTP_CODE) < 200 || Number(process.env.HTTP_CODE) >= 300) throw new Error(`dry-run HTTP ${process.env.HTTP_CODE}`);
          if (body?.success !== true || body?.dryRun !== true) throw new Error('dry-run did not confirm success');
          if (state?.shop?.myshopifyDomain !== '09fgkz-6n.myshopify.com') throw new Error('wrong Shopify store');
          if (Number(state?.active) !== 5062) throw new Error(`active count changed: ${state?.active}`);
          if (Number(state?.archived) !== 0 || Number(state?.unlisted) !== 0) throw new Error('unexpected archived/unlisted products');
          if (Number(state?.draft) < 0 || Number(state?.draft) > 1756) throw new Error(`draft count outside authorized bound: ${state?.draft}`);
          if (Number(state?.draft) > 0 && Number(body?.orphanCandidates) < 1) throw new Error('drafts exist but no safe orphan candidates were found');
          console.log(`Authorized orphan scope: active=${state.active}, drafts=${state.draft}, batchCandidates=${body.orphanCandidates}`);
          NODE

      - name: Delete orphan drafts in bounded verified batches
        shell: bash
        run: |
          set -euo pipefail
          oidc_token=''
          for batch in $(seq 1 100); do
            # GitHub OIDC tokens expire after a few minutes. Refresh every ten
            # batches so a long, read-back-verified purge cannot stall halfway.
            if [ $(( (batch - 1) % 10 )) -eq 0 ]; then
              oidc_token="$(curl --fail --silent --show-error \
                --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-orphan-purge" \
                | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
              test -n "$oidc_token"
              echo "::add-mask::$oidc_token"
            fi
            code="$(curl --silent --show-error --max-time 120 --output batch.json --write-out '%{http_code}' \
              --request POST \
              --header 'accept: application/json' \
              --header 'content-type: application/json' \
              --header "x-github-actions-oidc-token: ${oidc_token}" \
              --header "x-shopify-orphan-purge-confirm: ${CONFIRM}" \
              --data '{"limit":25,"confirm":"PURGE_DABDOOB_ORPHAN_DRAFTS"}' \
              "${RAILWAY_BASE_URL%/}/api/admin/purge-shopify-orphans")"
            cat batch.json
            result="$(HTTP_CODE="$code" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('batch.json', 'utf8'));
          const status = Number(process.env.HTTP_CODE);
          if (status < 200 || status >= 300 || body?.success !== true) {
            throw new Error(`purge batch failed HTTP=${status} code=${body?.code || 'unknown'}`);
          }
          if (Number(body?.after?.active) !== 5062) throw new Error(`active count changed during purge: ${body?.after?.active}`);
          if (Number(body?.after?.archived) !== 0 || Number(body?.after?.unlisted) !== 0) throw new Error('unexpected non-active product state appeared');
          if (Number(body?.failed) !== 0) throw new Error(`batch reported failed=${body?.failed}`);
          console.error(`batch deleted=${body?.deleted} drafts ${body?.before?.draft} -> ${body?.after?.draft}`);
          process.stdout.write(body?.complete === true || Number(body?.after?.draft) === 0 ? 'complete' : 'continue');
          NODE
            )"
            echo "Batch ${batch}: ${result}"
            if [ "$result" = complete ]; then break; fi
            sleep 1
          done

      - name: Verify final Shopify state
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dabdoob-orphan-purge" \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>process.stdout.write(JSON.parse(b).value||''))")"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          code="$(curl --silent --show-error --max-time 60 --output final.json --write-out '%{http_code}' \
            --request POST \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --header "x-github-actions-oidc-token: ${oidc_token}" \
            --header "x-shopify-orphan-purge-confirm: ${CONFIRM}" \
            --data '{"dryRun":true,"limit":25,"confirm":"PURGE_DABDOOB_ORPHAN_DRAFTS"}' \
            "${RAILWAY_BASE_URL%/}/api/admin/purge-shopify-orphans")"
          cat final.json
          HTTP_CODE="$code" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('final.json', 'utf8'));
          const state = body?.state || {};
          if (Number(process.env.HTTP_CODE) < 200 || Number(process.env.HTTP_CODE) >= 300) throw new Error(`final verification HTTP ${process.env.HTTP_CODE}`);
          if (state?.shop?.myshopifyDomain !== '09fgkz-6n.myshopify.com') throw new Error('wrong final Shopify store');
          if (Number(state?.active) !== 5062 || Number(state?.draft) !== 0 || Number(state?.archived) !== 0 || Number(state?.unlisted) !== 0) {
            throw new Error(`final state is not clean: ${JSON.stringify(state)}`);
          }
          console.log('FINAL_OK active=5062 draft=0 archived=0 unlisted=0');
          NODE
