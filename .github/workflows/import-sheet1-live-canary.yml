name: Sheet 1 audit safety lock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-sheet1-live-canary.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-sheet1-full-catalog-audit
  cancel-in-progress: true

jobs:
  safety-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unsafe full audit
        run: |
          echo "Full Sheet 1 audit is intentionally locked until the SKU generator matches the established DAB-NXT format."
          echo "No catalog writes are performed by this workflow."
