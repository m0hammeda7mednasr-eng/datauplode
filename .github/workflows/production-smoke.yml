name: Production Smoke Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabdoob-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ secrets.RAILWAY_SMOKE_BASE_URL }}
      SMOKE_SKIP_CATALOG_DRY_RUN: "false"
      SMOKE_TIMEOUT_MS: "60000"
      SMOKE_EXPECTED_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${SMOKE_EXPECTED_REVISION}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected revision must be a full 40-character Git SHA, received: ${SMOKE_EXPECTED_REVISION}" >&2
            exit 2
          fi
          CHECKED_OUT_REVISION="$(git rev-parse HEAD)"
          if [[ "${CHECKED_OUT_REVISION,,}" != "${SMOKE_EXPECTED_REVISION,,}" ]]; then
            echo "Checked-out revision ${CHECKED_OUT_REVISION} does not match expected revision ${SMOKE_EXPECTED_REVISION}." >&2
            exit 2
          fi
          echo "Checked-out revision verified: ${CHECKED_OUT_REVISION}"

      - name: Validate target URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_BASE_URL}" ]]; then
            echo "Missing Railway target URL. Configure the RAILWAY_SMOKE_BASE_URL repository secret." >&2
            exit 2
          fi
          if [[ ! "${SMOKE_BASE_URL}" =~ ^https:// ]]; then
            echo "Production smoke target must use HTTPS." >&2
            exit 2
          fi
          echo "Target host: $(node -e 'console.log(new URL(process.env.SMOKE_BASE_URL).host)')"
          echo "Expected deployed revision: ${SMOKE_EXPECTED_REVISION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safe production smoke check
        run: npm run smoke:production

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dabdoob production smoke"
            echo
            echo "- Target source locked to repository secret \`RAILWAY_SMOKE_BASE_URL\`; workflow URL overrides are disabled."
            echo "- Expected deployed revision: \`${SMOKE_EXPECTED_REVISION}\`"
            echo "- Checkout pinned and verified against the expected full Git SHA: \`true\`"
            echo "- Catalog dry run required: \`true\`"
            echo "- No Shopify write token is supplied by this workflow."
            echo "- The smoke script forces \`dryRun=true\`, \`writeSheet=false\`, and \`maxRows=1\`."
            echo "- The run fails when Railway reports a stale or different Git revision."
          } >> "$GITHUB_STEP_SUMMARY"
