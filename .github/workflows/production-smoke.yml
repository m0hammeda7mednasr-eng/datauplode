name: Production Smoke Check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Railway service base URL (optional; falls back to RAILWAY_SMOKE_BASE_URL secret)"
        required: false
        type: string
      skip_catalog_dry_run:
        description: "Skip the one-product catalog dry run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dabdoob-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ inputs.base_url || secrets.RAILWAY_SMOKE_BASE_URL }}
      SMOKE_SKIP_CATALOG_DRY_RUN: ${{ inputs.skip_catalog_dry_run }}
      SMOKE_TIMEOUT_MS: "60000"

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Validate target URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_BASE_URL}" ]]; then
            echo "Missing target URL. Provide workflow input base_url or configure RAILWAY_SMOKE_BASE_URL." >&2
            exit 2
          fi
          if [[ ! "${SMOKE_BASE_URL}" =~ ^https:// ]]; then
            echo "Production smoke target must use HTTPS." >&2
            exit 2
          fi
          echo "Target host: $(node -e 'console.log(new URL(process.env.SMOKE_BASE_URL).host)')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safe production smoke check
        run: npm run smoke:production

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dabdoob production smoke"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Catalog dry run skipped: \`${SMOKE_SKIP_CATALOG_DRY_RUN}\`"
            echo "- No Shopify write token is supplied by this workflow."
            echo "- The smoke script forces \`dryRun=true\`, \`writeSheet=false\`, and \`maxRows=1\`."
          } >> "$GITHUB_STEP_SUMMARY"
