name: Hotfix First5 Queue Throughput

on:
  push:
    branches: [stabilize-supabase-railway]
    paths: [.github/workflows/hotfix-first5-size-mapping.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-supabase-railway
      - name: Skip same-pass retries for blocked sources and defer Next lane
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/server/firstFiveSheetsReconcile.ts')
          s = p.read_text(encoding='utf-8')

          old_return = '''  return groups;
          }

          function readJson'''
          new_return = '''  return groups.sort((left, right) => {
            const leftNext = /(?:^|\\.)next\\.(?:ae|co\\.uk|us)$/i.test((() => {
              try { return new URL(left.url).hostname; } catch { return ""; }
            })());
            const rightNext = /(?:^|\\.)next\\.(?:ae|co\\.uk|us)$/i.test((() => {
              try { return new URL(right.url).hostname; } catch { return ""; }
            })());
            return Number(leftNext) - Number(rightNext);
          });
          }

          function readJson'''
          assert old_return in s, 'buildGroups return marker not found'
          s = s.replace(old_return, new_return, 1)

          old_catch = '''    } catch (error: any) {
                lastError = clean(error?.message || error).slice(0, 3000);
                console.warn("[first5-reconcile] group attempt failed", {
                  url: group.url,
                  rows: resultRows(group),
                  attempt: attempt + 1,
                  error: lastError,
                });
              }
            }'''
          new_catch = '''    } catch (error: any) {
                lastError = clean(error?.message || error).slice(0, 3000);
                const blockedSource = /(?:HTTP\\s*403|blocked automated server access|access denied|security verification|cloudflare)/i.test(lastError);
                console.warn("[first5-reconcile] group attempt failed", {
                  url: group.url,
                  rows: resultRows(group),
                  attempt: attempt + 1,
                  blockedSource,
                  error: lastError,
                });
                if (blockedSource) break;
              }
            }'''
          assert old_catch in s, 'processWithRetries catch block not found'
          s = s.replace(old_catch, new_catch, 1)

          assert 'return Number(leftNext) - Number(rightNext);' in s
          assert 'if (blockedSource) break;' in s
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/server/firstFiveSheetsReconcile.ts
      - name: Commit throughput hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add src/server/firstFiveSheetsReconcile.ts
          git commit -m 'Skip blocked source retries and defer Next lane'
          git push origin HEAD:stabilize-supabase-railway
