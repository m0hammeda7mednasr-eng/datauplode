name: Hotfix First5 Flattened Size Mapping

on:
  push:
    branches: [stabilize-supabase-railway]
    paths: [.github/workflows/hotfix-first5-size-mapping.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-supabase-railway
      - name: Fix flattened-size TypeScript inference
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/server/firstFiveSheetsReconcile.ts')
          s = p.read_text(encoding='utf-8')
          old = 'normalizeSizeToken(source.size || variant?.size || "") === titleSizeToken'
          new = 'normalizeSizeToken(source.size || (variant as any)?.size || "") === titleSizeToken'
          assert old in s, 'expected flattened-size expression not found'
          s = s.replace(old, new, 1)
          assert new in s
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/server/firstFiveSheetsReconcile.ts
      - name: Commit TypeScript fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add src/server/firstFiveSheetsReconcile.ts
          git commit -m 'Fix flattened size variant typing'
          git push origin HEAD:stabilize-supabase-railway
