name: Hotfix First5 Flattened Size Mapping

on:
  push:
    branches: [stabilize-supabase-railway]
    paths: [.github/workflows/hotfix-first5-size-mapping.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: stabilize-supabase-railway
      - name: Force explicit title size for flattened single variant
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          worker = Path('src/server/firstFiveSheetsReconcile.ts')
          s = worker.read_text(encoding='utf-8')
          old = '''  const singleDefaultVariant =
            product.variants.length === 1 &&
            Object.keys(shopifyOptions(product.variants[0])).length === 0;
          const titleSizeToken = singleDefaultVariant
            ? explicitTitleSizeToken(product.title)
            : null;

          const mapped = product.variants.map((current: any) => {
            if (singleDefaultVariant && titleSizeToken) {'''
          new = '''  const singleVariant = product.variants.length === 1;
          const titleSizeToken = singleVariant
            ? explicitTitleSizeToken(product.title)
            : null;
          if (singleVariant && /\\s-\\sSize\\s+/i.test(clean(product.title)) && !titleSizeToken) {
            throw new Error("Single-variant Shopify product has an explicit title size that could not be normalized safely");
          }

          const mapped = product.variants.map((current: any) => {
            if (singleVariant && titleSizeToken) {'''
          assert old in s, 'flattened single-variant mapping block not found'
          s = s.replace(old, new, 1)
          assert 'const singleVariant = product.variants.length === 1;' in s
          assert 'if (singleVariant && titleSizeToken)' in s
          assert 'explicit title size that could not be normalized safely' in s
          worker.write_text(s, encoding='utf-8')

          safety = Path('scripts/first5-reconcile-revision-safety-contract.ts')
          t = safety.read_text(encoding='utf-8')
          t = t.replace(
              "['single default variant uses explicit title-size mapping', /const singleDefaultVariant =[\\s\\S]*titleSizeToken[\\s\\S]*sizeMatches/.test(worker)],",
              "['single flattened variant uses explicit title-size mapping', /const singleVariant = product\\.variants\\.length === 1;[\\s\\S]*titleSizeToken[\\s\\S]*sizeMatches/.test(worker)],\n  ['single variant with an unparseable explicit title size fails closed', /explicit title size that could not be normalized safely/.test(worker)],",
          )
          assert 'single flattened variant uses explicit title-size mapping' in t
          assert 'unparseable explicit title size fails closed' in t
          safety.write_text(t, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/server/firstFiveSheetsReconcile.ts scripts/first5-reconcile-revision-safety-contract.ts
      - name: Commit mapping hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add src/server/firstFiveSheetsReconcile.ts scripts/first5-reconcile-revision-safety-contract.ts
          git commit -m 'Harden flattened single-variant size mapping'
          git push origin HEAD:stabilize-supabase-railway
